name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches VERSION in the card
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' room-climate-card.js)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      # No release asset: GitHub's redirect for release downloads carries a
      # Content-Security-Policy header over 8190 bytes, which aiohttp in Home
      # Assistant rejects. Without an asset, HACS fetches from
      # raw.githubusercontent.com instead.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
