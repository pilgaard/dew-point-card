name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches VERSION in the card
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' room-climate-card.js)
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: room-climate-card.js
          generate_release_notes: true
